<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    
    <!-- SEO & Meta -->
    <title>Solar System Explorer | Immersive 3D Experience</title>
    <meta name="description" content="Journey through our cosmic neighborhood in this award-winning immersive 3D solar system experience. Explore planets, moons, and the majesty of space.">
    <meta name="theme-color" content="#000008">
    
    <!-- Open Graph -->
    <meta property="og:title" content="Solar System Explorer | 3D Experience">
    <meta property="og:description" content="Immersive 3D journey through our solar system">
    <meta property="og:type" content="website">
    
    <!-- Google Fonts - Premium Typography -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=Space+Grotesk:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        'display': ['Space Grotesk', 'sans-serif'],
                        'body': ['Inter', 'sans-serif'],
                    },
                    colors: {
                        cosmos: {
                            bg: '#000005',
                            deep: '#020108',
                            accent: '#FDB813',
                            glow: '#FF6B35',
                            ice: '#00D4FF',
                            nebula: '#7B2CBF'
                        }
                    },
                    backdropBlur: {
                        xs: '2px',
                        '2xl': '40px',
                        '3xl': '64px',
                    }
                }
            }
        }
    </script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Favicon -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Cdefs%3E%3CradialGradient id='g'%3E%3Cstop offset='0%25' stop-color='%23FDB813'/%3E%3Cstop offset='100%25' stop-color='%23FF6B35'/%3E%3C/radialGradient%3E%3C/defs%3E%3Ccircle cx='50' cy='50' r='45' fill='url(%23g)'/%3E%3C/svg%3E">
</head>

<body class="overflow-hidden bg-cosmos-bg font-body antialiased selection:bg-cosmos-accent selection:text-black">

    <!-- ============================================ -->
    <!-- PREMIUM LOADING EXPERIENCE                   -->
    <!-- ============================================ -->
    <div id="loading-screen" class="fixed inset-0 z-[9999] flex items-center justify-center bg-cosmos-bg">
        <!-- Animated background gradient -->
        <div class="absolute inset-0 bg-[radial-gradient(ellipse_at_center,_var(--tw-gradient-stops))] from-cosmos-accent/10 via-transparent to-transparent animate-pulse-slow"></div>
        
        <!-- Loading content -->
        <div class="relative text-center">
            <!-- Cinematic sun animation -->
            <div class="relative w-28 h-28 mx-auto mb-10">
                <!-- Outer glow rings -->
                <div class="absolute inset-[-20px] rounded-full border border-cosmos-accent/20 animate-ping-slow"></div>
                <div class="absolute inset-[-40px] rounded-full border border-cosmos-glow/10 animate-ping-slower"></div>
                
                <!-- Main sun sphere -->
                <div id="loading-sun" class="absolute inset-4 rounded-full bg-gradient-to-br from-yellow-300 via-orange-400 to-red-500 shadow-[0_0_80px_rgba(253,184,19,0.6)] animate-pulse-sun">
                    <div class="absolute inset-0 rounded-full bg-gradient-to-t from-transparent to-white/30"></div>
                </div>
                
                <!-- Orbiting particles -->
                <div class="absolute inset-0 animate-spin-ultra-slow">
                    <div class="absolute top-0 left-1/2 -translate-x-1/2 w-2 h-2 rounded-full bg-blue-400 shadow-[0_0_10px_rgba(96,165,250,0.8)]"></div>
                </div>
                <div class="absolute inset-0 animate-spin-slow-reverse">
                    <div class="absolute bottom-0 left-1/2 -translate-x-1/2 w-1.5 h-1.5 rounded-full bg-emerald-400 shadow-[0_0_8px_rgba(52,211,153,0.8)]"></div>
                </div>
                <div class="absolute inset-0 animate-spin-medium">
                    <div class="absolute top-1/2 right-0 translate-y-1/2 w-2 h-2 rounded-full bg-purple-400 shadow-[0_0_10px_rgba(192,132,252,0.8)]"></div>
                </div>
            </div>
            
            <!-- Title -->
            <h1 class="font-display text-3xl md:text-4xl font-bold tracking-[0.3em] text-white mb-3 uppercase">
                Solar System
            </h1>
            <p class="text-white/30 text-sm tracking-widest mb-8 uppercase">Initializing Cosmos</p>
            
            <!-- Progress bar -->
            <div class="w-64 h-[2px] mx-auto bg-white/5 rounded-full overflow-hidden backdrop-blur-sm">
                <div id="progress-bar" class="h-full bg-gradient-to-r from-cosmos-accent via-cosmos-glow to-cosmos-ice rounded-full transition-all duration-500 ease-out" style="width: 0%; box-shadow: 0 0 20px rgba(253,184,19,0.5)"></div>
            </div>
            
            <!-- Status text -->
            <p id="loading-text" class="text-white/40 text-xs mt-4 font-light tracking-wide">Loading assets...</p>
        </div>
        
        <!-- Corner decorations -->
        <div class="absolute top-8 left-8 w-16 h-16 border-l-2 border-t-2 border-white/10"></div>
        <div class="absolute bottom-8 right-8 w-16 h-16 border-r-2 border-b-2 border-white/10"></div>
    </div>

    <!-- ============================================ -->
    <!-- THREE.JS CANVAS CONTAINER                   -->
    <!-- ============================================ -->
    <div id="canvas-container" class="fixed inset-0 w-full h-full"></div>

    <!-- ============================================ -->
    <!-- VIGNETTE OVERLAY (atmospheric depth)         -->
    <!-- ============================================ -->
    <div class="fixed inset-0 pointer-events-none z-10" style="background: radial-gradient(ellipse at center, transparent 0%, transparent 60%, rgba(0,0,5,0.4) 100%)"></div>

    <!-- ============================================ -->
    <!-- HEADER / BRANDING                            -->
    <!-- ============================================ -->
    <header id="main-header" class="fixed top-0 left-0 right-0 z-40 p-6 md:p-8 opacity-0 transition-all duration-1000 delay-700">
        <div class="flex items-center justify-between max-w-7xl mx-auto">
            <!-- Logo -->
            <div class="flex items-center gap-3 group cursor-pointer" onclick="window.location.reload()">
                <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-cosmos-accent to-cosmos-glow flex items-center justify-center shadow-lg shadow-cosmos-accent/20 group-hover:shadow-cosmos-accent/40 transition-shadow duration-300">
                    <svg class="w-5 h-5 text-black" fill="currentColor" viewBox="0 0 24 24">
                        <circle cx="12" cy="12" r="5"/>
                        <path d="M12 2v2m0 16v2M4.93 4.93l1.41 1.41m11.32 11.32l1.41 1.41M2 12h2m16 0h2M6.34 17.66l-1.41 1.41M19.07 4.93l-1.41 1.41" stroke="currentColor" stroke-width="1.5" fill="none" stroke-linecap="round"/>
                    </svg>
                </div>
                <div class="hidden sm:block">
                    <h1 class="font-display font-semibold text-white text-sm tracking-wider">SOLAR SYSTEM</h1>
                    <p class="text-[10px] text-white/30 tracking-widest uppercase">Explorer v2.0</p>
                </div>
            </div>

            <!-- Stats indicator (decorative) -->
            <div class="hidden md:flex items-center gap-6 text-xs text-white/30">
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-green-400 animate-pulse"></span>
                    <span>8 Planets</span>
                </div>
                <div class="flex items-center gap-2">
                    <span class="w-2 h-2 rounded-full bg-cosmos-ice"></span>
                    <span>Real-time 3D</span>
                </div>
            </div>
        </div>
    </header>

    <!-- ============================================ -->
    <!-- PREMIUM NAVIGATION CONTROLS                  -->
    <!-- ============================================ -->
    <nav id="navigation-controls" class="fixed top-1/2 -translate-y-1/2 right-6 md:right-10 z-40 opacity-0 transition-all duration-1000 delay-1000">
        <div class="flex flex-col gap-2 p-3 rounded-2xl backdrop-blur-2xl bg-white/[0.03] border border-white/[0.08] shadow-2xl shadow-black/50">
            
            <!-- Sun button -->
            <button data-target="sun" class="nav-btn group relative w-12 h-12 rounded-xl flex items-center justify-center text-white/50 hover:text-white hover:bg-white/10 transition-all duration-300 overflow-hidden" title="Sun">
                <div class="absolute inset-0 bg-gradient-to-br from-cosmos-accent/20 to-transparent opacity-0 group-hover:opacity-100 transition-opacity"></div>
                <span class="nav-dot relative w-6 h-6 rounded-full bg-gradient-to-br from-yellow-300 to-orange-500 shadow-lg shadow-orange-500/30"></span>
                <span class="nav-tooltip absolute right-full mr-3 px-3 py-1.5 rounded-lg bg-black/80 backdrop-blur-sm text-xs whitespace-nowrap opacity-0 group-hover:opacity-100 transition-opacity pointer-events-none">Sun</span>
            </button>
            
            <div class="h-px bg-white/10 mx-2"></div>
            
            <!-- Planet buttons (generated by JS) -->
            <div id="planet-nav-buttons" class="flex flex-col gap-1.5"></div>
        </div>
        
        <!-- Decorative line -->
        <div class="absolute -left-px top-1/2 -translate-y-1/2 w-px h-20 bg-gradient-to-b from-transparent via-white/20 to-transparent"></div>
    </nav>

    <!-- ============================================ -->
    <!-- BOTTOM NAVIGATION (Mobile)                   -->
    <!-- ============================================ -->
    <nav id="mobile-nav" class="fixed bottom-6 left-1/2 -translate-x-1/2 z-40 md:hidden opacity-0 transition-opacity duration-1000 delay-1000">
        <div class="flex items-center gap-1 p-2 rounded-2xl backdrop-blur-2xl bg-white/[0.05] border border-white/[0.08] shadow-xl shadow-black/50 overflow-x-auto max-w-[90vw] scrollbar-hide">
            <button data-target="sun" class="nav-btn-mobile shrink-0 px-3 py-2 rounded-xl flex items-center gap-2 text-white/50 hover:text-white hover:bg-white/10 transition-all">
                <span class="w-4 h-4 rounded-full bg-gradient-to-br from-yellow-300 to-orange-500"></span>
                <span class="text-[10px] font-medium">Sun</span>
            </button>
            <div id="mobile-planet-buttons" class="flex items-center gap-1"></div>
        </div>
    </nav>

    <!-- ============================================ -->
    <!-- INTERACTIVE HINT                             -->
    <!-- ============================================ -->
    <div id="hint-container" class="fixed bottom-8 left-1/2 -translate-x-1/2 z-30 opacity-0 transition-all duration-1000 delay-1500 pointer-events-none hidden md:block">
        <div class="flex items-center gap-3 px-5 py-3 rounded-full backdrop-blur-xl bg-white/[0.03] border border-white/[0.08] shadow-lg">
            <div class="flex items-center gap-1.5">
                <span class="w-1.5 h-1.5 rounded-full bg-cosmos-ice animate-pulse"></span>
                <span class="text-white/40 text-xs font-light tracking-wide">Click any planet to explore</span>
            </div>
            <div class="w-px h-4 bg-white/10"></div>
            <div class="flex items-center gap-1.5 text-white/30 text-xs">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="1.5" d="M15 15l-2 5L9 9l11 4-5 2zm0 0l5 5M7.188 2.239l.777 2.897M5.136 7.965l-2.898-.777M13.95 4.05l-2.122 2.122m-5.657 5.656l-2.12 2.122"/>
                </svg>
                <span>Drag to rotate</span>
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- PLANET INFO OVERLAY (Premium Glassmorphism) -->
    <!-- ============================================ -->
    <div id="planet-overlay" class="fixed inset-0 z-50 pointer-events-none opacity-0 invisible transition-all duration-500">
        <!-- Backdrop blur overlay -->
        <div class="absolute inset-0 bg-black/30 backdrop-blur-sm"></div>
        
        <!-- Overlay panel -->
        <div id="overlay-panel" class="absolute bottom-6 left-6 right-6 md:bottom-10 md:left-10 md:right-auto md:w-[420px] transform translate-y-8 scale-[0.98] opacity-0 transition-all duration-700 cubic-bezier(0.22, 1, 0.36, 1)">
            <div class="relative backdrop-blur-3xl bg-white/[0.04] border border-white/[0.1] rounded-3xl shadow-2xl shadow-black/50 overflow-hidden pointer-events-auto">
                
                <!-- Gradient accent line at top -->
                <div id="overlay-accent-bar" class="absolute top-0 left-0 right-0 h-[2px] bg-gradient-to-r from-transparent via-cosmos-accent to-transparent"></div>
                
                <!-- Ambient glow effect -->
                <div id="overlay-glow" class="absolute -top-20 -right-20 w-40 h-40 rounded-full blur-3xl opacity-20"></div>
                
                <!-- Content container -->
                <div class="relative p-6 md:p-8">
                    
                    <!-- Close button -->
                    <button id="close-overlay-btn" class="absolute top-4 right-4 w-9 h-9 flex items-center justify-center rounded-xl bg-white/5 hover:bg-white/10 border border-white/10 hover:border-white/20 text-white/40 hover:text-white transition-all duration-200 group">
                        <svg class="w-4 h-4 group-hover:rotate-90 transition-transform duration-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/>
                        </svg>
                    </button>
                    
                    <!-- Planet header section -->
                    <div class="flex items-start gap-5 mb-6">
                        <!-- Planet icon/sphere preview -->
                        <div id="overlay-icon-container" class="relative shrink-0">
                            <div id="overlay-icon" class="w-16 h-16 rounded-2xl flex items-center justify-center shadow-xl">
                                <div id="overlay-icon-inner" class="w-11 h-11 rounded-full shadow-lg"></div>
                            </div>
                            <!-- Pulsing ring effect -->
                            <div class="absolute inset-0 rounded-2xl border-2 border-dashed border-white/10 animate-spin-slow"></div>
                        </div>
                        
                        <!-- Title info -->
                        <div class="pt-1 min-w-0">
                            <h2 id="overlay-title" class="font-display text-2xl font-bold text-white tracking-tight truncate">Planet Name</h2>
                            <p id="overlay-subtitle" class="text-white/40 text-sm mt-1 flex items-center gap-2">
                                <span id="subtitle-text">Information</span>
                                <span class="w-1 h-1 rounded-full bg-white/20"></span>
                                <span id="subtitle-detail">Details</span>
                            </p>
                        </div>
                    </div>
                    
                    <!-- Description -->
                    <p id="overlay-description" class="text-white/60 text-sm leading-relaxed mb-6 font-light line-clamp-3"></p>
                    
                    <!-- Key facts grid -->
                    <div id="overlay-facts" class="grid grid-cols-2 gap-2.5 mb-6"></div>
                    
                    <!-- Action buttons -->
                    <div class="flex gap-3">
                        <button id="back-button" class="flex-1 flex items-center justify-center gap-2 py-3.5 px-5 rounded-xl font-medium text-sm bg-white/[0.06] hover:bg-white/[0.1] text-white border border-white/[0.1] hover:border-white/20 transition-all duration-300 active:scale-[0.98] group">
                            <svg class="w-4 h-4 group-hover:-translate-x-1 transition-transform" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"/>
                            </svg>
                            <span>Back to System</span>
                        </button>
                        
                        <button id="explore-btn" class="py-3.5 px-4 rounded-xl bg-gradient-to-br from-cosmos-accent to-cosmos-glow text-black font-semibold text-sm hover:shadow-lg hover:shadow-cosmos-accent/30 transition-all duration-300 active:scale-95">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0zM10 7v3m0 0v3m0-3h3m-3 0H7"/>
                            </svg>
                        </button>
                    </div>
                </div>
                
                <!-- Bottom decorative element -->
                <div class="absolute bottom-0 left-0 right-0 h-20 bg-gradient-to-t from-black/20 to-transparent pointer-events-none"></div>
            </div>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- SCRIPTS                                      -->
    <!-- ============================================ -->
    
    <!-- Import Map for ES Modules (Three.js + Addons) -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <!-- GSAP Animation Library -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.4/gsap.min.js"></script>
    
    <!-- Main Application Script -->
    <script type="module" src="script.js"></script>
</body>
</html>
