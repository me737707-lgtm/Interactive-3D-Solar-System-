<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interactive 3D Solar System | Explore Our Cosmic Neighborhood</title>
    <meta name="description" content="An immersive 3D experience exploring the Sun, planets, and wonders of our solar system">
    
    <!-- Tailwind CSS via CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- Custom Styles -->
    <link rel="stylesheet" href="style.css">
    
    <!-- Favicon (inline SVG) -->
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🌌</text></svg>">
</head>
<body class="overflow-hidden bg-[#000008]">
    
    <!-- ============================================ -->
    <!-- LOADING SCREEN                                -->
    <!-- ============================================ -->
    <div id="loading-screen" class="fixed inset-0 z-[100] flex items-center justify-center bg-[#000008] transition-opacity duration-500">
        <div class="text-center">
            <!-- Animated Sun Icon -->
            <div class="relative w-20 h-20 mx-auto mb-8">
                <div id="loading-sun" class="absolute inset-0 rounded-full bg-gradient-to-br from-yellow-400 to-orange-500 animate-pulse-sun"></div>
                <div id="loading-orbit-1" class="absolute inset-0 animate-spin-slow">
                    <div class="absolute top-1/2 left-[30%] w-2 h-2 -translate-x-1/2 -translate-y-1/2 rounded-full bg-blue-400"></div>
                </div>
                <div id="loading-orbit-2" class="absolute inset-0 animate-spin-medium">
                    <div class="absolute top-1/2 left-[50%] w-2 h-2 -translate-x-1/2 -translate-y-1/2 rounded-full bg-red-500"></div>
                </div>
                <div id="loading-orbit-3" class="absolute inset-0 animate-spin-fast">
                    <div class="absolute top-1/2 left-[70%] w-2 h-2 -translate-x-1/2 -translate-y-1/2 rounded-full bg-orange-300"></div>
                </div>
            </div>
            
            <h1 class="text-2xl font-bold text-white mb-4 tracking-widest">SOLAR SYSTEM</h1>
            
            <!-- Progress Bar -->
            <div class="w-48 h-1 mx-auto bg-white/10 rounded-full overflow-hidden">
                <div id="progress-bar" class="h-full bg-gradient-to-r from-yellow-400 to-orange-500 rounded-full transition-all duration-300" style="width: 0%"></div>
            </div>
            
            <p id="loading-text" class="text-white/50 text-sm mt-3">Initializing cosmos...</p>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- THREE.JS CANVAS CONTAINER                    -->
    <!-- ============================================ -->
    <div id="canvas-container" class="fixed inset-0 w-full h-full"></div>

    <!-- ============================================ -->
    <!-- NAVIGATION CONTROLS                          -->
    <!-- ============================================ -->
    <nav id="navigation-controls" class="fixed top-4 left-1/2 -translate-x-1/2 z-40 opacity-0 transition-opacity duration-500">
        <div class="flex items-center gap-2 p-2 rounded-full backdrop-blur-xl bg-white/5 border border-white/10 shadow-lg">
            <!-- Sun Button -->
            <button data-target="sun" class="nav-btn group relative flex items-center gap-2 px-3 py-2 rounded-full text-white/70 hover:text-white hover:bg-white/10 transition-all duration-200 active:scale-95">
                <span class="w-3 h-3 rounded-full shrink-0 bg-yellow-400 nav-dot"></span>
                <span class="hidden sm:inline text-xs font-medium whitespace-nowrap">Sun</span>
            </button>
            
            <div class="w-px h-6 bg-white/20 mx-1"></div>
            
            <!-- Planet buttons will be generated by JS -->
            <div id="planet-nav-buttons"></div>
        </div>
    </nav>

    <!-- ============================================ -->
    <!-- PLANET INFO OVERLAY (Glassmorphism)          -->
    <!-- ============================================ -->
    <div id="planet-overlay" class="fixed bottom-4 left-4 right-4 md:bottom-8 md:left-8 md:right-auto md:max-w-md z-50 opacity-0 translate-y-6 pointer-events-none transition-all duration-500 ease-out">
        <div class="relative backdrop-blur-xl bg-white/10 border border-white/20 rounded-2xl shadow-2xl p-6 md:p-8" id="overlay-content">
            
            <!-- Close Button -->
            <button id="close-overlay-btn" class="absolute top-4 right-4 w-8 h-8 flex items-center justify-center rounded-full bg-white/10 hover:bg-white/20 transition-colors text-white/70 hover:text-white pointer-events-auto">
                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <line x1="18" y1="6" x2="6" y2="18"></line>
                    <line x1="6" y1="6" x2="18" y2="18"></line>
                </svg>
            </button>

            <!-- Planet Header -->
            <div class="flex items-center gap-3 mb-4">
                <div id="overlay-icon" class="w-12 h-12 rounded-full flex items-center justify-center shadow-lg">
                    <div id="overlay-icon-inner" class="w-8 h-8 rounded-full"></div>
                </div>
                <div>
                    <h2 id="overlay-title" class="text-2xl font-bold text-white tracking-tight">Planet Name</h2>
                    <p id="overlay-subtitle" class="text-white/50 text-sm capitalize"></p>
                </div>
            </div>

            <!-- Description -->
            <p id="overlay-description" class="text-white/80 text-sm leading-relaxed mb-6"></p>

            <!-- Key Facts Grid -->
            <div id="overlay-facts" class="grid grid-cols-2 gap-3 mb-6"></div>

            <!-- Back Button -->
            <button id="back-button" class="w-full py-3 px-4 rounded-xl font-medium text-sm transition-all duration-200 bg-white/10 hover:bg-white/20 text-white border border-white/20 active:scale-[0.98] pointer-events-auto">
                ← Back to Solar System
            </button>
        </div>
    </div>

    <!-- ============================================ -->
    <!-- INSTRUCTIONS HINT                            -->
    <!-- ============================================ -->
    <div id="instructions-hint" class="fixed bottom-8 left-1/2 -translate-x-1/2 text-white/40 text-sm pointer-events-none opacity-0 transition-opacity duration-500">
        Click on any planet to explore • Drag to rotate view • Scroll to zoom
    </div>

    <!-- ============================================ -->
    <!-- SCRIPTS                                      -->
    <!-- ============================================ -->
    <!-- Import Map for ES Modules (Three.js) -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
            "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
        }
    }
    </script>
    
    <!-- GSAP for animations -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.4/gsap.min.js"></script>
    
    <!-- Main Application Script (ES Module) -->
    <script type="module" src="script.js"></script>
</body>
</html>
